# Runs the ruff pinned in uv.lock, so the hook, the editor and the CLI agree.
# Hooks that change files fail the commit; stage the fixes and commit again.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
